# This file configures the static analysis results for your project (errors,
# warnings, and lints).
#
# This enables the 'recommended' set of lints from `package:lints`.
# This set helps identify many issues that may lead to problems when running
# or consuming Dart code, and enforces writing Dart using a single, idiomatic
# style and format.
#
# If you want a smaller set of lints you can change this to specify
# 'package:lints/core.yaml'. These are just the most critical lints
# (the recommended set includes the core lints).
# The core lints are also what is used by pub.dev for scoring packages.

include: package:lints/recommended.yaml

# ============================================================================
# Camada 2 — lints built-in alinhados com PATTERN_MATCHING_POLICY (ADR-019).
# Rules custom mais rigorosas (catch_without_stack_in_adapter, etc.) ficam
# para o package `acdg_lints` — ver A22 ticket (.pipeline/phase-3-bff-...).
# ============================================================================

linter:
  rules:
    # Error handling — alinha com P2b (ADR-019 §Hard-reject em catch(_))
    empty_catches: true              # proíbe `catch (_) {}` vazio — reprovação automática P2b
    avoid_catching_errors: true      # `catch (Error e)` geralmente é bug, não adapter
    use_rethrow_when_possible: true  # rethrow em vez de `throw e;` perdendo stack

    # Pattern matching — alinha com P1 exhaustiveness
    exhaustive_cases: true           # switch deve cobrir todos os cases (enums, sealed)
    no_default_cases: true           # complementa exhaustive_cases — proíbe `default:`

    # Tear-offs — alinha com P3
    unnecessary_lambdas: true        # `(x) => foo(x)` → `foo` tear-off

    # Nota: `avoid_print`, `prefer_single_quotes`, `require_trailing_commas`
    # não estão ligados aqui para evitar ruído em VOs (Address, CNS) e legacy
    # handlers que A11–A15 vão reescrever. Ligar pós-A21 cleanup.

analyzer:
  errors:
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
