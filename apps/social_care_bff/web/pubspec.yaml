name: social_care_web
description: Web BFF for Social Care — shelf HTTP server with OIDC auth, session management, and API proxy.
version: 1.2.0
publish_to: 'none'

resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  shared:
    path: ../contracts
  core_contracts:
    path: ../../../kernel/contracts

  # HTTP server
  shelf: ^1.4.2
  shelf_router: ^1.1.4

  # Logging (structured breadcrumbs + error forwarding)
  logging: ^1.2.0

  # HTTP client (API backend calls)
  dio: ^5.9.2

  # OIDC / JWT
  http: ^1.4.0
  dart_jsonwebtoken: ^3.0.0
  crypto: ^3.0.6

  # Direct dep — JWKS cache parses JWK n/e components into a
  # `pc.RSAPublicKey` so `dart_jsonwebtoken.RSAPublicKey.raw(...)` can
  # consume them without round-tripping through PEM. Already a transitive
  # dep of dart_jsonwebtoken; listed here to satisfy
  # `depend_on_referenced_packages` and to pin the contract.
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
  custom_lint: ^0.8.1
  acdg_lints:
    path: ../../../kernel/lints
