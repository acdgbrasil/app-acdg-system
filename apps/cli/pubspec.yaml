name: cli
description: ACDG CLI — operate the social care system from the command line.
version: 1.0.0
publish_to: 'none'

resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  args: ^2.6.0
  crypto: ^3.0.6
  dart_mcp: 0.5.1   # PIN sem caret — boundary adapter absorve mudanças (ADR-MCP-001-v2)
  dio: ^5.7.0
  http: ^1.4.0
  logging: ^1.3.0
  meta: ^1.16.0
  yaml: ^3.1.2

  # Contract A DTOs (BFF request/response shapes)
  shared:
    path: ../social_care_bff/contracts

  # Result<T> + Equatable + uuid utilities
  core_contracts:
    path: ../../kernel/contracts

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
  custom_lint: ^0.8.1
  acdg_lints:
    path: ../../kernel/lints
